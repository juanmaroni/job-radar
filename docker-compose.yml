services:
  tracker:
    container_name: tracker
    build:
      context: .
      dockerfile: services/tracker-service/Dockerfile
    env_file:
      - .env.docker
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis_tracker:
        condition: service_healthy

  matching:
    container_name: matching
    build:
      context: .
      dockerfile: services/matching-service/Dockerfile
    env_file:
      - .env.docker
    ports:
      - "50051:50051"
 
  postgres:
    container_name: postgres
    image: postgres:18.6-alpine
    restart: always
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${TRACKER_SERVICE_DATABASE_USER}
      POSTGRES_PASSWORD: ${TRACKER_SERVICE_DATABASE_PW}
      POSTGRES_DB: ${TRACKER_SERVICE_DATABASE_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRACKER_SERVICE_DATABASE_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./services/tracker-service/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql
      - ./services/tracker-service/migrations/0002_add_match_score.sql:/docker-entrypoint-initdb.d/0002_add_match_score.sql
      - ./postgres-data:/var/lib/postgresql
  
  redis_tracker:
    container_name: redis_tracker
    image: redis:8.10.1-alpine
    restart: always
    env_file:
      - .env.docker
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    container_name: redpanda
    image: redpandadata/redpanda:v26.2.2
    ports:
      - "18081:18081"
      - "18082:18082"
      - "19092:19092"
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 15s
      retries: 10
    volumes:
      - redpanda:/var/lib/redpanda/data

volumes:
  redpanda:
