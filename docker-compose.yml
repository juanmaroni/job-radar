services:
  tracker:
    container_name: tracker
    build:
      context: ./services/tracker-service/
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis_tracker:
        condition: service_healthy
 
  postgres:
    image: postgres:18.6-alpine
    restart: always
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${TRACKER_SERVICE_DATABASE_USER}
      POSTGRES_PASSWORD: ${TRACKER_SERVICE_DATABASE_PW}
      POSTGRES_DB: ${TRACKER_SERVICE_DATABASE_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRACKER_SERVICE_DATABASE_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./services/tracker-service/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql
      - ./postgres-data:/var/lib/postgresql
  
  redis_tracker:
    image: redis:8.10.1-alpine
    restart: always
    env_file:
      - .env.docker
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
